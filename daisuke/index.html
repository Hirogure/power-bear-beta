<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f4f0">
<title>Daisuke専用 トレーニングメニューアプリ</title>
<style>
:root{
  --bg:#f5f4f0;--bg2:#eeede8;--bg3:#e4e3de;
  --card:#fff;
  --t1:#1c1c1a;--t2:#6b6a66;--t3:#9a9994;
  --b1:rgba(0,0,0,.12);--b2:rgba(0,0,0,.22);--b3:rgba(0,0,0,.35);
  --green:#1a5c2a;--green-bg:#e8f4ec;--green-t:#1a5c2a;
  --amber:#7a4400;--amber-bg:#fff3e0;--amber-t:#7a4400;
  --red:#8b1a1a;--red-bg:#fdf0f0;--red-t:#8b1a1a;
  --blue:#1a4a7a;--blue-bg:#e8f0fa;--blue-t:#1a4a7a;
  --gray-bg:#f0efe9;--gray-t:#6b6a66;
  --r:10px;--r2:14px;
  --font:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:15px;line-height:1.5;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg)}
#hdr{background:var(--card);border-bottom:1px solid var(--b1);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#hdr-name{font-size:17px;font-weight:700;letter-spacing:.3px}
#hdr-date{font-size:13px;color:var(--t2)}
#nav{display:flex;background:var(--card);border-bottom:1px solid var(--b1);flex-shrink:0}
.nav-btn{flex:1;padding:11px 4px;font-size:13px;font-family:var(--font);background:none;border:none;border-bottom:2.5px solid transparent;color:var(--t2);cursor:pointer;font-weight:500}
.nav-btn.active{color:var(--t1);border-bottom-color:var(--t1);font-weight:700}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sec{display:none;padding:12px 12px 120px}
.sec.active{display:block}

/* Cards */
.card{background:var(--card);border:1px solid var(--b1);border-radius:var(--r2);padding:14px;margin-bottom:10px}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--t1)}
.card-sub{font-size:12px;color:var(--t2);margin-top:2px}

/* Selector rows */
.sel-row{display:flex;gap:6px;flex-wrap:wrap}
.sel-btn{padding:8px 14px;border-radius:var(--r);border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:13px;font-family:var(--font);cursor:pointer;font-weight:500;min-height:40px}
.sel-btn.active{background:var(--t1);color:#fff;border-color:var(--t1)}

/* Condition sliders */
.cond-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cond-lbl{font-size:13px;color:var(--t2);width:52px;flex-shrink:0}
.cond-sl{flex:1;accent-color:var(--t1);height:24px}
.cond-val{font-size:14px;font-weight:700;width:16px;text-align:right}
.cond-val.bad{color:var(--red)}
.cond-val.good{color:var(--green)}

/* Condition warning banner */
.cond-warn{background:var(--amber-bg);border:1px solid #e8a000;border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--amber-t);margin-bottom:10px;display:none}
.cond-warn.show{display:block}

/* Exercise cards */
.ex-card{background:var(--card);border:1.5px solid var(--b1);border-radius:var(--r2);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.ex-card.ex-done{border-color:#7ec89a}
.ex-card.ex-skip{opacity:.55}
.ex-hdr{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px}
.ex-hdr:active{background:var(--bg2)}
.pri-badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;flex-shrink:0;white-space:nowrap}
.pri-must{background:var(--red-bg);color:var(--red)}
.pri-should{background:var(--amber-bg);color:var(--amber-t)}
.pri-can{background:var(--gray-bg);color:var(--gray-t)}
.ex-main{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:700;line-height:1.3}
.ex-tgt{font-size:12px;color:var(--t3);margin-top:1px}
.ex-stat{font-size:13px;color:var(--t2);flex-shrink:0;text-align:right;line-height:1.3}
.ex-body{padding:0 14px 14px;border-top:1px solid var(--b1);background:var(--card)}

/* Warn chip inside exercise */
.warn-chip{display:inline-block;background:var(--amber-bg);color:var(--amber-t);font-size:11px;padding:2px 8px;border-radius:6px;margin-top:4px;margin-bottom:6px}

/* Weight inputs */
.w-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.w-lbl{font-size:13px;color:var(--t2);flex-shrink:0}
.w-inp{width:90px;height:44px;border:1.5px solid var(--b2);border-radius:var(--r);font-size:18px;font-weight:700;padding:0 10px;font-family:var(--font);background:var(--bg);color:var(--t1);text-align:center}
.w-inp:focus{outline:none;border-color:var(--t1)}
.w-unit{font-size:13px;color:var(--t2)}

/* Warmup chips */
.warmup-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wu-chip{background:var(--bg2);border-radius:var(--r);padding:6px 10px;font-size:12px;color:var(--t2)}
.wu-chip strong{color:var(--t1);font-size:14px}
.wu-chip .pct{font-size:10px;color:var(--t3);display:block;margin-bottom:1px}

/* Phase main weight */
.phase-main{background:var(--blue-bg);border-radius:var(--r);padding:6px 12px;font-size:13px;color:var(--blue-t);margin-bottom:10px;display:inline-block}

/* Set rows */
.sets-area{margin:8px 0}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:10px 10px;background:var(--bg2);border-radius:var(--r);transition:background .15s}
.set-row.set-done{background:#e8f4ec}
.set-num{font-size:13px;font-weight:700;color:var(--t2);width:34px;flex-shrink:0}
.rep-inp{width:70px;height:44px;border:1.5px solid var(--b2);border-radius:var(--r);font-size:20px;font-weight:700;text-align:center;font-family:var(--font);background:var(--card);color:var(--t1)}
.rep-inp:focus{outline:none;border-color:var(--t1)}
.rep-inp:disabled{background:transparent;border-color:transparent;color:var(--green);font-size:18px}
.rep-unit{font-size:13px;color:var(--t2);flex-shrink:0}
.set-done-btn{margin-left:auto;height:44px;padding:0 16px;border-radius:var(--r);border:none;background:var(--t1);color:#fff;font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;flex-shrink:0}
.set-done-btn:active{opacity:.8}
.set-done-btn.done{background:var(--green-bg);color:var(--green);border:1.5px solid #7ec89a}
.set-done-btn.done::before{content:'✓ '}
.add-set-btn{background:none;border:1.5px dashed var(--b2);border-radius:var(--r);padding:8px 16px;color:var(--t2);font-size:13px;font-family:var(--font);cursor:pointer;width:100%;margin-top:4px}

/* Alt section */
.alt-toggle{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--b1);margin-top:10px;cursor:pointer}
.alt-toggle label{font-size:13px;color:var(--t2);cursor:pointer;flex:1}
.alt-toggle input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--t1)}
.alt-details{padding:10px 0;border-bottom:1px solid var(--b1);display:none}
.alt-details.show{display:block}
.alt-reason-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.alt-reason-btn{padding:7px 12px;border-radius:20px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:12px;font-family:var(--font);cursor:pointer;font-weight:500}
.alt-reason-btn.active{background:var(--t1);color:#fff;border-color:var(--t1)}
.alt-names{background:var(--bg2);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-top:4px}
.alt-name-item{padding:4px 0;color:var(--t1);cursor:pointer;border-bottom:1px solid var(--b1)}
.alt-name-item:last-child{border:none}
.alt-name-item.selected{color:var(--green);font-weight:700}
.alt-custom{font-size:13px;color:var(--blue-t);margin-top:6px;font-style:italic}

/* Pain row */
.pain-row{display:flex;gap:6px;margin:10px 0;align-items:center}
.pain-lbl{font-size:13px;color:var(--t2);flex-shrink:0}
.pain-btn{flex:1;height:40px;border-radius:var(--r);border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:12px;font-family:var(--font);cursor:pointer;font-weight:600}
.pain-btn.active-none{background:#e8f4ec;border-color:#7ec89a;color:var(--green)}
.pain-btn.active-slight{background:var(--amber-bg);border-color:#e8a000;color:var(--amber-t)}
.pain-btn.active-stop{background:var(--red-bg);border-color:#d04040;color:var(--red)}
.pain-warn{background:var(--red-bg);color:var(--red);font-size:12px;padding:8px 12px;border-radius:var(--r);margin-bottom:8px;display:none}
.pain-warn.show{display:block}

/* Note */
.note-inp{width:100%;border:1.5px solid var(--b1);border-radius:var(--r);padding:10px 12px;font-size:15px;font-family:var(--font);background:var(--bg);color:var(--t1);resize:none;min-height:60px;margin-top:6px}
.note-inp:focus{outline:none;border-color:var(--t1)}
.note-lbl{font-size:12px;color:var(--t2);margin-top:10px;display:block}

/* Suggestion chip */
.suggest{padding:8px 12px;border-radius:var(--r);font-size:13px;margin-top:10px;display:inline-block;font-weight:600}
.suggest-up{background:#e8f4ec;color:var(--green)}
.suggest-stable{background:var(--blue-bg);color:var(--blue-t)}
.suggest-pain{background:var(--red-bg);color:var(--red)}
.suggest-none{background:var(--bg2);color:var(--t2)}

/* Skip */
.skip-row{display:flex;justify-content:flex-end;margin-top:8px}
.skip-btn{padding:7px 14px;border-radius:var(--r);border:1.5px solid var(--b2);background:none;color:var(--t3);font-size:12px;font-family:var(--font);cursor:pointer}

/* Session controls */
.session-ctrl{background:var(--card);border:1px solid var(--b1);border-radius:var(--r2);padding:14px;margin-bottom:10px;margin-top:4px}
.session-note-inp{width:100%;border:1.5px solid var(--b1);border-radius:var(--r);padding:10px 12px;font-size:15px;font-family:var(--font);background:var(--bg);color:var(--t1);resize:none;min-height:64px}
.session-note-inp:focus{outline:none;border-color:var(--t1)}
.save-btn{width:100%;height:52px;background:var(--t1);color:#fff;font-size:16px;font-weight:700;font-family:var(--font);border:none;border-radius:var(--r2);cursor:pointer;margin-top:10px;letter-spacing:.5px}
.save-btn:active{opacity:.85}

/* Timer overlay */
#timer-bar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card);border-top:2px solid var(--b2);padding:12px 16px;z-index:200;display:none;box-shadow:0 -4px 20px rgba(0,0,0,.1)}
#timer-bar.show{display:block}
#timer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#timer-label{font-size:12px;color:var(--t2);flex:1}
#timer-num{font-size:36px;font-weight:900;letter-spacing:1px;color:var(--t1);text-align:center;flex:1}
#timer-num.almost{color:var(--amber-t)}
#timer-num.done-state{color:var(--green)}
#timer-btns{display:flex;gap:8px;margin-top:8px}
.timer-btn{flex:1;height:44px;border-radius:var(--r);border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer}
.timer-btn:active{background:var(--bg3)}
#timer-hint{font-size:12px;color:var(--amber-t);background:var(--amber-bg);border-radius:var(--r);padding:6px 10px;margin-top:8px;display:none}
#timer-hint.show{display:block}

/* Log tab */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.cal-day{background:var(--card);border-radius:var(--r);padding:6px 4px;text-align:center;cursor:pointer;border:1.5px solid var(--b1);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal-day.has-session{border-color:#7ec89a;background:#f0faf3}
.cal-day.today{border-color:var(--t1);border-width:2px}
.cal-day.selected{background:var(--t1);color:#fff;border-color:var(--t1)}
.cal-day.selected .cal-dow,.cal-day.selected .cal-d{color:#fff}
.cal-day.future{opacity:.4;cursor:default;pointer-events:none}
.cal-dow{font-size:10px;color:var(--t3)}
.cal-d{font-size:15px;font-weight:700}
.cal-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.session-detail{background:var(--card);border-radius:var(--r2);border:1px solid var(--b1);padding:14px;margin-bottom:10px}
.sd-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--b1);font-size:13px}
.sd-row:last-child{border:none;padding-bottom:0}
.sd-lbl{color:var(--t2);flex-shrink:0;width:100px}
.sd-val{color:var(--t1);font-weight:600;text-align:right;flex:1}
.ex-log-item{padding:8px 0;border-bottom:1px solid var(--b1);font-size:13px}
.ex-log-item:last-child{border:none}
.ex-log-name{font-weight:700;margin-bottom:2px}
.ex-log-sets{color:var(--t2);font-size:12px}
.ex-log-flag{font-size:11px;padding:2px 8px;border-radius:10px;display:inline-block;margin-left:6px}
.flag-pain{background:var(--red-bg);color:var(--red)}
.flag-alt{background:var(--amber-bg);color:var(--amber-t)}

/* Summary */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum-stat{background:var(--card);border-radius:var(--r);padding:12px;border:1px solid var(--b1);text-align:center}
.sum-num{font-size:26px;font-weight:900;color:var(--t1)}
.sum-lbl{font-size:12px;color:var(--t2);margin-top:2px}
.sum-list{font-size:13px;color:var(--t1)}
.sum-list li{padding:5px 0;border-bottom:1px solid var(--b1);list-style:none}
.sum-list li:last-child{border:none}

/* Reference tab */
.ref-section{margin-bottom:12px}
.ref-toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border-radius:var(--r2);border:1px solid var(--b1);cursor:pointer;font-size:14px;font-weight:700}
.ref-body{background:var(--card);border:1px solid var(--b1);border-top:none;border-radius:0 0 var(--r2) var(--r2);padding:14px;display:none;font-size:13px;color:var(--t2);line-height:1.7}
.ref-body.open{display:block}
.ref-body strong{color:var(--t1)}
.ref-table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.ref-table th{text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--b2);font-weight:700;color:var(--t1)}
.ref-table td{padding:6px 8px;border-bottom:1px solid var(--b1)}
.ref-table tr:last-child td{border:none}

/* Data management */
.data-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.data-btn{flex:1;min-width:120px;height:44px;border-radius:var(--r);border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer}
.data-btn.danger{background:var(--red-bg);color:var(--red);border-color:#d04040}
.data-btn:active{opacity:.8}

/* Misc */
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.tag-must{background:var(--red-bg);color:var(--red)}
.tag-should{background:var(--amber-bg);color:var(--amber-t)}
.tag-can{background:var(--gray-bg);color:var(--gray-t)}
.section-title{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;margin-top:16px}
.section-title:first-child{margin-top:0}
.empty{text-align:center;color:var(--t3);font-size:14px;padding:40px 0}
hr.sep{border:none;border-top:1px solid var(--b1);margin:12px 0}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

/* Progress bar */
.progress-card{background:var(--card);border:1px solid var(--b1);border-radius:var(--r2);padding:12px 14px;margin-bottom:10px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress-lbl{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px}
.progress-num{font-size:18px;font-weight:900;color:var(--t1)}
.progress-sub{font-size:12px;font-weight:500;color:var(--t3);margin-left:6px}
.progress-bar-bg{height:10px;background:var(--bg3);border-radius:5px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--green);border-radius:5px;transition:width .35s ease}
.progress-bar-fill.full{background:#1a5c2a}

/* Condition hint labels */
.cond-hint{font-size:11px;color:var(--t3);flex-shrink:0;white-space:nowrap;line-height:24px}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="hdr-name">Daisuke専用メニュー</div>
    <div id="hdr-date"></div>
  </div>
  <div id="nav">
    <button class="nav-btn active" onclick="showTab('today')">今日の実行</button>
    <button class="nav-btn" onclick="showTab('log')">2週間記録</button>
    <button class="nav-btn" onclick="showTab('ref')">設計書</button>
  </div>
  <div id="content">
    <div id="sec-today" class="sec active"></div>
    <div id="sec-log" class="sec"></div>
    <div id="sec-ref" class="sec"></div>
  </div>
  <div id="timer-bar">
    <div id="timer-top">
      <div id="timer-label">休憩タイマー</div>
      <div id="timer-num">0:00</div>
    </div>
    <div id="timer-btns">
      <button class="timer-btn" id="btn-pause" onclick="pauseTimer()">⏸ 停止</button>
      <button class="timer-btn" id="btn-plus" onclick="addTime(30)">+30秒</button>
      <button class="timer-btn" id="btn-skip" onclick="skipTimer()">スキップ →</button>
    </div>
    <div id="timer-hint"></div>
  </div>
</div>
<script>
const USER = { name:'Daisuke', id:'daisuke' };
const KEYS = {
  log: d => `trainingLog_daisuke_${d}`,
  hist: 'exerciseHistory_daisuke',
  summary: 'betaSummary_daisuke',
  state: 'currentState_daisuke',
  betaStart: 'betaStartDate_daisuke'
};
const PRI = { must:'必須', should:'できれば', can:'余裕があれば' };
const PRI_CLASS = { must:'pri-must', should:'pri-should', can:'pri-can' };
const PAIN_LABELS = { none:'なし', slight:'少しあり', stop:'中止レベル' };
const ALT_REASONS = [
  { key:'busy', label:'器具が空いていない' },
  { key:'pain', label:'痛み/違和感' },
  { key:'unsure', label:'やり方が不安' },
  { key:'pref', label:'好み' }
];
const DAYS = {
  d1: { label:'Day 1 — Push A', sub:'胸・肩前部・三頭筋' },
  d2: { label:'Day 2 — Pull A', sub:'背中・二頭筋・後部三角筋' },
  d3: { label:'Day 3 — Legs', sub:'脚・臀部（上半身回復日）' },
  d4: { label:'Day 4 — Push B', sub:'肩・三頭筋・胸2nd' },
  d5: { label:'Day 5 — Pull B', sub:'背中2nd・二頭筋・後部三角筋' }
};

// ── Exercise data ──
const EX = {
d1:[
{id:'d1_e1',name:'スミスマシンベンチプレス',target:'大胸筋中部・上部',priority:'must',
 plan:{p1:{sets:3,reps:'10',rmin:10,rest:150},p2:{sets:4,reps:'8〜10',rmin:8,rest:180},p3:{sets:5,reps:'6〜8',rmin:6,rest:180}},
 alts:{busy:'チェストプレス（マシン）',pain:'チェストプレス（マシン・軽重量）',pref:'バーベルベンチプレス（要安全確認）'},
 warn:'パワーラック未選択。スポッター確認要'},
{id:'d1_e2',name:'インクラインダンベルプレス（30〜45°）',target:'大胸筋上部・鎖骨部',priority:'must',

// ── State ──
let S = {
  tab:'today', day:'d1', phase:'p1',
  cond:{f:3,s:3,so:3}, time:75,
  date: todayStr(), startTime: null,
  exData:{}, sessionNote:'',
  logDay: null
};
let timer = { active:false, paused:false, remaining:0, intervalId:null, exName:'', setIdx:0, restSecs:0 };

// ── Utils ──
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(str) {
  if(!str) return '';
  const [y,m,d] = str.split('-');
  return `${m}/${d}`;
}
function fmtSecs(s) {
  const m = Math.floor(Math.abs(s)/60), sec = Math.abs(s)%60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function round25(v) { return Math.round(v/2.5)*2.5; }
function isBadCond() { return S.cond.f >= 4 || S.cond.s <= 2; }
function condHint() {
  if(!isBadCond()) return '';
  const extra = S.cond.f >= 4 ? 60 : 30;
  return `💡 コンディション注意 — 休憩を+${extra}秒延ばすことを検討`;
}
function filteredEx() {
  const all = EX[S.day];
  if(S.time <= 30) return all.filter(e => e.priority === 'must');
  if(S.time <= 45) return all.filter(e => e.priority !== 'can');
  return all;
}

// ── Time-based volume scaling ──
// 30/45/60min: base sets from plan
// 75min: must exercises +1 set, others unchanged
// 90min: must+should exercises +1 set, others unchanged
function effectiveSets(ex, phase, time) {
  const base = ex.plan[phase].sets;
  if(time >= 90 && (ex.priority === 'must' || ex.priority === 'should')) return base + 1;
  if(time >= 75 && time < 90 && ex.priority === 'must') return base + 1;
  return base;
}

// Calculate today's progress across all filtered exercises
function calcProgress() {
  const exes = filteredEx();
  let total = 0, done = 0;
  exes.forEach(ex => {
    const eff = effectiveSets(ex, S.phase, S.time);
    total += eff;
    const d = S.exData[ex.id];
    if(d) done += Math.min(d.sets.filter(s => s.done).length, eff);
  });
  return { total, done, pct: total > 0 ? Math.min(100, Math.round(done / total * 100)) : 0 };
}

// ── β開始日管理 ──
function getBetaStartDate() { return lsGet(KEYS.betaStart); }

function getBeta14Days() {
  const start = getBetaStartDate();
  if(!start) return [];
  const base = new Date(start + 'T00:00:00');
  const days = [];
  for(let i = 0; i < 14; i++) {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  }
  return days;
}

function fmtDateDisplay(str) {
  if(!str) return '';
  const [y,m,d] = str.split('-');
  return `${y}/${m}/${d}`;
}

// Called from the setup card: save and rerender (records not affected)
function saveBetaStart(ds) {
  if(!ds || !/^\d{4}-\d{2}-\d{2}$/.test(ds)) {
    alert('日付の形式が正しくありません');
    return;
  }
  lsSet(KEYS.betaStart, ds);
  renderLog();
}

// Called from the "開始日を変更" button
function changeBetaStart() {
  // Check whether any day in the current window has a record
  const days14 = getBeta14Days();
  const hasRecords = days14.some(d => !!lsGet(KEYS.log(d)));
  if(hasRecords) {
    if(!confirm('開始日を変更するとサマリー対象期間が変わります。\n記録データは削除されません。\n続けますか？')) return;
  }
  // Clear only the start date — all training records are preserved
  lsDel(KEYS.betaStart);
  S.logDay = null;
  renderLog();
}

// ── Storage ──
function lsGet(key) { try { const v=localStorage.getItem(key); return v?JSON.parse(v):null; } catch(e){return null;} }
function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
function lsDel(key) { try { localStorage.removeItem(key); } catch(e){} }

function saveSession() {
  // Fix1: scope to filteredEx() so hidden exercises don't affect completion rate
  const exes = filteredEx();
  let totalSets=0, doneSets=0;
  const exSave = {};
  exes.forEach(ex => {
    const d = S.exData[ex.id];
    if(!d) return;
    const eff = effectiveSets(ex, S.phase, S.time);
    totalSets += eff;
    // Fix3: cap completed sets at effective target to prevent >100%
    doneSets += Math.min(d.sets.filter(s=>s.done).length, eff);
    exSave[ex.id] = {
      maxW: d.maxW, todayW: d.todayW,
      sets: d.sets, altUsed: d.altUsed, altReason: d.altReason,
      altName: d.altName, pain: d.pain, note: d.note, skipped: d.skipped
    };
  });
  const now = new Date();
  const endTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  // Fix3: ensure rate never exceeds 100 even with extra sets
  const rate = totalSets > 0 ? Math.min(100, Math.round(doneSets/totalSets*100)) : 0;
  const session = {
    date: S.date, day: S.day, phase: S.phase,
    cond: {...S.cond}, time: S.time,
    startTime: S.startTime, endTime,
    completionRate: rate, exercises: exSave,
    note: S.sessionNote, saved: Date.now()
  };
  lsSet(KEYS.log(S.date), session);
  updateHistory(exSave);
}

function loadTodaySession() {
  const saved = lsGet(KEYS.log(S.date));
  if(!saved) return;
  if(saved.day) S.day = saved.day;
  if(saved.phase) S.phase = saved.phase;
  if(saved.cond) S.cond = saved.cond;
  if(saved.time) S.time = saved.time;
  if(saved.startTime) S.startTime = saved.startTime;
  if(saved.note) S.sessionNote = saved.note;
  if(saved.exercises) {
    Object.entries(saved.exercises).forEach(([id, d]) => {
      S.exData[id] = { maxW:d.maxW||'', todayW:d.todayW||'',
        sets: d.sets||[], altUsed:d.altUsed||false,
        altReason:d.altReason||'', altName:d.altName||'',
        pain:d.pain||'none', note:d.note||'', skipped:d.skipped||false, open:false };
    });
  }
}

function updateHistory(exSave) {
  const hist = lsGet(KEYS.hist) || {};
  Object.entries(exSave).forEach(([id, d]) => {
    if(!hist[id]) hist[id] = [];
    const reps = d.sets.filter(s=>s.done).map(s=>parseInt(s.reps)||0);
    if(reps.length === 0) return;
    const minR = Math.min(...reps);
    const newRecord = {
      date: S.date, weight: parseFloat(d.todayW)||0, minReps: minR,
      setsCompleted: reps.length, pain: d.pain, altUsed: d.altUsed
    };
    // Fix2: overwrite existing record for the same date to prevent duplicates
    // (auto-save would otherwise push a new entry on every keypress)
    const existIdx = hist[id].findIndex(r => r.date === S.date);
    if(existIdx >= 0) {
      hist[id][existIdx] = newRecord;
    } else {
      hist[id].push(newRecord);
    }
    hist[id] = hist[id].slice(-20);
  });
  lsSet(KEYS.hist, hist);
}

function getWeightSuggestion(exId, plan) {
  const hist = lsGet(KEYS.hist) || {};
  const records = (hist[exId] || []).filter(r => r.weight > 0);
  if(records.length === 0) return {type:'none', msg:'記録なし — 重量を入力するとアドバイスが表示されます'};
  const last = records[records.length-1];
  // Fix5: look at CONSECUTIVE recent sessions at the same weight (not all-time same weight)
  // Walk backwards from the most recent record; stop as soon as weight changes
  const consecutive = [];
  for(let i = records.length - 1; i >= 0; i--) {
    if(records[i].weight === last.weight) {
      consecutive.unshift(records[i]);
    } else {
      break; // non-consecutive weight found — stop
    }
  }
  // Pain check always takes priority
  const hasPain = consecutive.some(r => r.pain === 'slight' || r.pain === 'stop');
  if(hasPain) return {type:'pain', msg:'⚠ 直近に痛み記録あり — 重量アップ非推奨'};
  // Need at least 2 consecutive sessions at same weight to judge
  if(consecutive.length < 2) return {type:'stable', msg:'同重量で2〜3回連続達成すると重量アップ候補が表示されます'};
  const allHit = consecutive.every(r => r.minReps >= plan.rmin);
  if(allHit) return {type:'up', msg:`次回 +2.5kg 候補（現在 ${last.weight}kg → ${last.weight+2.5}kg）`};
  return {type:'stable', msg:'次回は重量維持でrep安定を優先'};
}

// ── Init exercise data ──
function ensureExData(ex) {
  const eff = effectiveSets(ex, S.phase, S.time);
  if(!S.exData[ex.id]) {
    S.exData[ex.id] = {
      maxW:'', todayW:'',
      sets: Array(eff).fill(null).map(()=>({reps:'',done:false})),
      altUsed:false, altReason:'', altName:'', pain:'none', note:'', skipped:false, open:false
    };
  } else {
    const d = S.exData[ex.id];
    // Expand when time increases (never contract — keep completed sets)
    if(d.sets.length < eff) {
      while(d.sets.length < eff) d.sets.push({reps:'',done:false});
    }
  }
}

// ── Warmup calc ──
function warmupChips(maxW) {
  if(!maxW || isNaN(maxW) || maxW <= 0) return '';
  const w1=round25(maxW*.4), w2=round25(maxW*.6), w3=round25(maxW*.775);
  const plan = EX[S.day][0]?.plan[S.phase]; // dummy
  const pct = {p1:[65,70],p2:[72,80],p3:[80,87.5]};
  const [lo,hi] = pct[S.phase];
  const mlo=round25(maxW*lo/100), mhi=round25(maxW*hi/100);
  return `<div class="warmup-row">
    <div class="wu-chip"><span class="pct">WU 40%</span><strong>${w1}kg</strong></div>
    <div class="wu-chip"><span class="pct">WU 60%</span><strong>${w2}kg</strong></div>
    <div class="wu-chip"><span class="pct">WU 75%</span><strong>${w3}kg</strong></div>
  </div>
  <div class="phase-main">Phase${S.phase.slice(1)} メイン目安: ${mlo}〜${mhi}kg</div>`;
}

// ── Render today ──
function renderToday() {
  const day = DAYS[S.day];
  const exes = filteredEx();
  const hint = condHint();
  const dayOpts = Object.entries(DAYS).map(([k,v]) =>
    `<button class="sel-btn${S.day===k?' active':''}" onclick="setDay('${k}')">${v.label.split('—')[0].trim()}</button>`
  ).join('');
  const phaseOpts = ['p1','p2','p3'].map(p =>
    `<button class="sel-btn${S.phase===p?' active':''}" onclick="setPhase('${p}')">Phase ${p.slice(1)}</button>`
  ).join('');
  const timeOpts = [30,45,60,75,90].map(t =>
    `<button class="sel-btn${S.time===t?' active':''}" onclick="setTime(${t})">${t}分</button>`
  ).join('');
  const condRows = [
    {key:'f',  lbl:'疲労',   lo:'低い', hi:'高い'},
    {key:'s',  lbl:'睡眠',   lo:'悪い', hi:'良い'},
    {key:'so', lbl:'筋肉痛', lo:'なし', hi:'強い'}
  ].map(c => {
    const v = S.cond[c.key];
    const cls = (c.key==='s' ? v<=2 : v>=4) ? 'bad' : (c.key==='s' ? v>=4 : v<=2) ? 'good' : '';
    return `<div class="cond-row">
      <span class="cond-lbl">${c.lbl}</span>
      <span class="cond-hint">${c.lo}</span>
      <input type="range" class="cond-sl" min="1" max="5" value="${v}"
        oninput="setCond('${c.key}',+this.value)" />
      <span class="cond-hint">${c.hi}</span>
      <span class="cond-val ${cls}">${v}</span>
    </div>`;
  }).join('');
  const exHtml = exes.map(ex => renderExCard(ex)).join('');
  const prog = calcProgress();
  const startBtnHtml = !S.startTime
    ? `<button class="sel-btn" style="width:100%;justify-content:center;margin-bottom:10px" onclick="startSession()">▶ セッション開始</button>`
    : `<div style="font-size:12px;color:var(--t2);margin-bottom:10px">🕐 開始: ${S.startTime}</div>`;
  document.getElementById('sec-today').innerHTML = `
    <div class="card">
      <div class="card-title">📅 ${S.date} &nbsp;<span style="font-size:13px;color:var(--t2)">${day.sub}</span></div>
      <div class="section-title">Day</div>
      <div class="sel-row" style="margin-bottom:10px">${dayOpts}</div>
      <div class="section-title">Phase</div>
      <div class="sel-row" style="margin-bottom:10px">${phaseOpts}</div>
      <div class="section-title">今日の予定時間</div>
      <div class="sel-row">${timeOpts}</div>
    </div>
    <div class="card">
      <div class="card-title">コンディション</div>
      ${condRows}
    </div>
    <div class="cond-warn${hint?' show':''}" id="cond-warn">${hint}</div>
    <div class="progress-card">
      <div class="progress-top">
        <span class="progress-lbl">今日の達成率</span>
        <span><span class="progress-num">${prog.pct}%</span><span class="progress-sub">${prog.done} / ${prog.total} セット完了</span></span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill${prog.pct>=100?' full':''}" style="width:${prog.pct}%"></div>
      </div>
    </div>
    <div class="section-title">種目 (${exes.length}種目 / 全${EX[S.day].length}種目)</div>
    ${startBtnHtml}
    ${exHtml}
    <div class="session-ctrl">
      <div class="card-title">セッションメモ</div>
      <textarea class="session-note-inp" placeholder="今日の感想・気づきなど（任意）"
        oninput="S.sessionNote=this.value">${S.sessionNote}</textarea>
      <button class="save-btn" onclick="onSaveSession()">✓ 保存する</button>
    </div>`;
}

function renderExCard(ex) {
  ensureExData(ex);
  const d = S.exData[ex.id];
  const plan = ex.plan[S.phase];
  const eff = effectiveSets(ex, S.phase, S.time);
  const done = d.sets.filter(s=>s.done).length;
  const isAllDone = done >= eff && eff > 0;
  const sug = getWeightSuggestion(ex.id, plan);
  const sugClass = {up:'suggest-up',stable:'suggest-stable',pain:'suggest-pain',none:'suggest-none'}[sug.type];
  const wuHtml = warmupChips(parseFloat(d.maxW));
  const setsHtml = d.sets.map((set, i) => {
    if(set.done) {
      return `<div class="set-row set-done">
        <span class="set-num">Set${i+1}</span>
        <span style="font-size:16px;font-weight:700;color:var(--green)">${set.reps} 回</span>
        <span style="font-size:13px;color:var(--t3);margin-left:4px">${d.todayW?d.todayW+'kg':''}</span>
        <button class="set-done-btn done" style="pointer-events:none">完了</button>
      </div>`;
    }
    return `<div class="set-row" id="sr_${ex.id}_${i}">
      <span class="set-num">Set${i+1}</span>
      <input type="number" inputmode="numeric" class="rep-inp" id="ri_${ex.id}_${i}"
        placeholder="${plan.reps.split('〜')[0]||'10'}" min="1" max="99"
        value="${set.reps||''}" onchange="setRepVal('${ex.id}',${i},this.value)" />
      <span class="rep-unit">回</span>
      <button class="set-done-btn" onclick="completeSet('${ex.id}',${i},${plan.rest})">完了</button>
    </div>`;
  }).join('');
  const altReasonBtns = ALT_REASONS.map(r =>
    `<button class="alt-reason-btn${d.altReason===r.key?' active':''}"
      onclick="setAltReason('${ex.id}','${r.key}')">${r.label}</button>`
  ).join('');
  const altNames = ex.alts;
  const altNameList = [
    {key:'busy', name:altNames.busy},
    {key:'pain', name:altNames.pain},
    {key:'pref', name:altNames.pref}
  ].map(a =>
    `<div class="alt-name-item${d.altName===a.name?' selected':''}" onclick="setAltName('${ex.id}','${a.name.replace(/'/g,'\\\'')}')">${a.name}</div>`
  ).join('');
  const painBtns = ['none','slight','stop'].map(p =>
    `<button class="pain-btn${d.pain===p?' active-'+p:''}" onclick="setPain('${ex.id}','${p}')">${PAIN_LABELS[p]}</button>`
  ).join('');
  return `<div class="ex-card${isAllDone?' ex-done':''}${d.skipped?' ex-skip':''}" id="ec_${ex.id}">
    <div class="ex-hdr" onclick="toggleEx('${ex.id}')">
      <span class="pri-badge ${PRI_CLASS[ex.priority]}">${PRI[ex.priority]}</span>
      <div class="ex-main">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-tgt">${ex.target}</div>
      </div>
      <div class="ex-stat">${isAllDone?'✓ 完了':`${done}/${eff}`}<br>${d.open?'▲':'▼'}</div>
    </div>
    ${d.open ? `<div class="ex-body">
      ${ex.warn ? `<div class="warn-chip">⚠ ${ex.warn}</div>` : ''}
      <div class="section-title" style="margin-top:8px">重量設定</div>
      <div class="w-row" style="align-items:flex-start">
        <span class="w-lbl" style="line-height:1.35;padding-top:6px">過去MAX/<br>基準重量</span>
        <input type="number" inputmode="decimal" class="w-inp" placeholder="kg"
          value="${d.maxW}" onchange="setMaxW('${ex.id}',this.value)" />
        <span class="w-unit" style="padding-top:6px">kg</span>
      </div>
      <div style="font-size:12px;color:var(--t2);margin-bottom:8px;line-height:1.5">
        過去MAXが不明な場合は、普段8〜10回できる重量を入力してもOK<br>
        → ウォームアップ重量・Phase別メイン目安を自動計算
      </div>
      <div id="wu_${ex.id}">${wuHtml}</div>
      <div class="w-row" style="margin-top:8px">
        <span class="w-lbl">今日の重量</span>
        <input type="number" inputmode="decimal" class="w-inp" placeholder="kg"
          value="${d.todayW}" onchange="setTodayW('${ex.id}',this.value)" />
        <span class="w-unit">kg（全セット共通）</span>
      </div>
      <div class="section-title" style="margin-top:12px">目標: ${plan.reps}回 × ${eff}セット（${fmtSecs(plan.rest)}休憩）${eff > plan.sets ? ' <span style="font-size:11px;background:var(--amber-bg);color:var(--amber-t);padding:2px 7px;border-radius:10px;font-weight:600">+1セット</span>' : ''}</div>
      <div class="sets-area">${setsHtml}</div>
      <button class="add-set-btn" onclick="addSet('${ex.id}')">+ セット追加</button>
      <div class="alt-toggle">
        <input type="checkbox" id="alt_chk_${ex.id}" ${d.altUsed?'checked':''}
          onchange="setAltUsed('${ex.id}',this.checked)" />
        <label for="alt_chk_${ex.id}">代替種目を使った</label>
      </div>
      <div class="alt-details${d.altUsed?' show':''}" id="altd_${ex.id}">
        <div class="alt-reason-row">${altReasonBtns}</div>
        <div class="alt-names">${altNameList}</div>
      </div>
      <div class="pain-row">
        <span class="pain-lbl">痛み</span>
        ${painBtns}
      </div>
      <div class="pain-warn${d.pain!=='none'?' show':''}" id="pw_${ex.id}">
        痛みや違和感がある場合は無理をせず、軽重量か代替種目に切り替えてください。
      </div>
      <label class="note-lbl">メモ</label>
      <textarea class="note-inp" rows="2" placeholder="フォーム・感覚など（任意）"
        onchange="setExNote('${ex.id}',this.value)">${d.note}</textarea>
      <div class="suggest ${sugClass}" style="margin-top:10px;width:100%;display:block">${sug.msg}</div>
      <div class="skip-row">
        <button class="skip-btn" onclick="skipEx('${ex.id}')">${d.skipped?'✓ スキップ済':'この種目をスキップ'}</button>
      </div>
    </div>` : ''}
  </div>`;
}

// ── Actions ──
function showTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.nav-btn').forEach((b,i) => {
    b.classList.toggle('active', ['today','log','ref'][i] === tab);
  });
  document.querySelectorAll('.sec').forEach((s,i) => {
    s.classList.toggle('active', ['sec-today','sec-log','sec-ref'][i].replace('sec-','') === tab);
  });
  if(tab==='today') renderToday();
  if(tab==='log') renderLog();
  if(tab==='ref') renderRef();
}

function setDay(d) { S.day = d; initExData(); renderToday(); }
function setPhase(p) { S.phase = p; renderToday(); }
function setTime(t) { S.time = t; renderToday(); }
function setCond(k, v) {
  S.cond[k] = v;
  document.getElementById('cond-warn').className = 'cond-warn' + (condHint()?' show':'');
  document.getElementById('cond-warn').textContent = condHint();
  schedSave();
}

function initExData() {
  const exes = EX[S.day];
  exes.forEach(ex => ensureExData(ex));
}

function startSession() {
  const now = new Date();
  S.startTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  renderToday();
  saveSession();
}

function toggleEx(id) {
  const d = S.exData[id];
  if(d) d.open = !d.open;
  renderToday();
}

function setMaxW(id, v) {
  const d = S.exData[id];
  if(!d) return;
  d.maxW = v;
  document.getElementById('wu_'+id).innerHTML = warmupChips(parseFloat(v));
  schedSave();
}

function setTodayW(id, v) {
  const d = S.exData[id];
  if(d) { d.todayW = v; schedSave(); }
}

function setRepVal(id, idx, v) {
  const d = S.exData[id];
  if(d && d.sets[idx]) { d.sets[idx].reps = v; schedSave(); }
}

function completeSet(exId, idx, restSecs) {
  const d = S.exData[exId];
  if(!d) return;
  const repEl = document.getElementById(`ri_${exId}_${idx}`);
  const reps = repEl ? (parseInt(repEl.value)||0) : 0;
  if(reps <= 0) { repEl && repEl.focus(); return; }
  d.sets[idx].done = true;
  d.sets[idx].reps = reps;
  if(!S.startTime) {
    const now = new Date();
    S.startTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  }
  schedSave();
  const ex = EX[S.day].find(e=>e.id===exId);
  startTimer(restSecs, (ex?ex.name:''), idx+1);
  renderToday();
}

function addSet(id) {
  const d = S.exData[id];
  if(d) { d.sets.push({reps:'',done:false}); renderToday(); }
}

function setAltUsed(id, v) {
  const d = S.exData[id];
  if(d) { d.altUsed = v; if(!v){d.altReason='';d.altName='';} schedSave(); renderToday(); }
}

function setAltReason(id, r) {
  const d = S.exData[id];
  if(d) { d.altReason = r; schedSave(); renderToday(); }
}

function setAltName(id, n) {
  const d = S.exData[id];
  if(d) { d.altName = (d.altName===n?'':n); schedSave(); renderToday(); }
}

function setPain(id, p) {
  const d = S.exData[id];
  if(d) { d.pain = p; schedSave(); renderToday(); }
}

function setExNote(id, v) {
  const d = S.exData[id];
  if(d) { d.note = v; schedSave(); }
}

function skipEx(id) {
  const d = S.exData[id];
  if(d) { d.skipped = !d.skipped; schedSave(); renderToday(); }
}

function onSaveSession() {
  saveSession();
  const btn = document.querySelector('.save-btn');
  if(btn) { btn.textContent = '✓ 保存しました'; btn.style.background='var(--green)'; }
  setTimeout(()=>{ const b=document.querySelector('.save-btn'); if(b){b.textContent='✓ 保存する';b.style.background='';} }, 2000);
}

let saveTimer = null;
function schedSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveSession, 800); }

// ── Timer ──
function startTimer(secs, exName, setNum) {
  clearInterval(timer.intervalId);
  timer = { active:true, paused:false, remaining:secs, restSecs:secs, exName, setNum, intervalId:null };
  updateTimerUI();
  document.getElementById('timer-bar').classList.add('show');
  timer.intervalId = setInterval(tick, 1000);
}

function tick() {
  if(timer.paused) return;
  timer.remaining--;
  if(timer.remaining <= 0) {
    timerDone();
  } else {
    updateTimerUI();
  }
}

function updateTimerUI() {
  const num = document.getElementById('timer-num');
  const lbl = document.getElementById('timer-label');
  const hint = document.getElementById('timer-hint');
  if(!num) return;
  const h = condHint();
  hint.className = h ? 'timer-hint show' : 'timer-hint';
  hint.textContent = h;
  num.textContent = fmtSecs(timer.remaining);
  num.className = timer.remaining <= 10 ? 'almost' : '';
  lbl.textContent = `${timer.exName} — Set${timer.setNum} 完了 | 休憩`;
  document.getElementById('btn-pause').textContent = timer.paused ? '▶ 再開' : '⏸ 停止';
}

function timerDone() {
  clearInterval(timer.intervalId);
  const num = document.getElementById('timer-num');
  if(num) { num.textContent = '▶ 次のセットへ'; num.className = 'done-state'; }
  if('vibrate' in navigator) navigator.vibrate([200,100,200]);
  timer.active = false;
}

function pauseTimer() {
  timer.paused = !timer.paused;
  updateTimerUI();
}

function addTime(s) {
  timer.remaining += s;
  if(!timer.active) {
    timer.active = true;
    clearInterval(timer.intervalId);
    timer.intervalId = setInterval(tick, 1000);
  }
  updateTimerUI();
}

function skipTimer() {
  clearInterval(timer.intervalId);
  timer.active = false;
  timer.remaining = 0;
  document.getElementById('timer-bar').classList.remove('show');
}

// ── Log tab ──
function renderLog() {
  const today = S.date;
  const betaStart = getBetaStartDate();

  // ── 未設定: 開始日セットアップカード ──
  if(!betaStart) {
    document.getElementById('sec-log').innerHTML = `
      <div class="card">
        <div class="card-title">📅 β開始日を設定してください</div>
        <p style="font-size:13px;color:var(--t2);margin-bottom:14px;line-height:1.7">
          実際に最初にジムで使う日を選んでください。<br>
          カレンダーとサマリーがその日から14日分で表示されます。<br>
          開始日を設定するまで記録タブは使えません。
        </p>
        <div style="margin-bottom:12px">
          <label style="font-size:13px;color:var(--t2);display:block;margin-bottom:6px">開始日</label>
          <input type="date" id="betaStartInput"
            style="height:44px;border:1.5px solid var(--b2);border-radius:var(--r);
                   font-size:16px;padding:0 12px;background:var(--bg);color:var(--t1);font-family:var(--font)"
            value="${today}" min="2024-01-01" max="2030-12-31" />
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="sel-btn active" style="flex:1;justify-content:center"
            onclick="saveBetaStart(document.getElementById('betaStartInput').value)">
            保存する
          </button>
          <button class="sel-btn" style="flex:1;justify-content:center"
            onclick="saveBetaStart('${today}')">
            今日から開始
          </button>
        </div>
      </div>`;
    return;
  }

  // ── 設定済: カレンダー + サマリー ──
  const days14 = getBeta14Days();
  const endDate = days14[days14.length - 1];
  const DOW = ['日','月','火','水','木','金','土'];

  const calHtml = days14.map(ds => {
    const sess = lsGet(KEYS.log(ds));
    const d = new Date(ds + 'T00:00:00');
    const dow = DOW[d.getDay()];
    const dd = d.getDate();
    const isTd = ds === today;
    const isSel = ds === S.logDay;
    const isFuture = ds > today;
    const cls = [
      'cal-day',
      sess ? 'has-session' : '',
      isTd ? 'today' : '',
      isSel ? 'selected' : '',
      isFuture ? 'future' : ''
    ].filter(Boolean).join(' ');
    const clickHandler = isFuture ? '' : `onclick="selectLogDay('${ds}')"`;
    return `<div class="${cls}" ${clickHandler}>
      <span class="cal-dow">${dow}</span>
      <span class="cal-d">${dd}</span>
      ${sess ? '<span class="cal-dot"></span>' : ''}
    </div>`;
  }).join('');

  // サマリー集計（β期間のみ）
  const sessions = days14.map(d => ({date:d, s:lsGet(KEYS.log(d))})).filter(x => x.s);
  const total = sessions.length;
  const rates = sessions.map(x => x.s.completionRate || 0);
  const avgRate = rates.length ? Math.round(rates.reduce((a,b) => a+b, 0) / rates.length) : 0;
  const altCount = {};
  const painEx = [];
  sessions.forEach(({s}) => {
    if(!s.exercises) return;
    Object.entries(s.exercises).forEach(([id, ex]) => {
      if(ex.altUsed) altCount[id] = (altCount[id] || 0) + 1;
      if(ex.pain && ex.pain !== 'none') {
        const nm = EX[s.day]?.find(e => e.id === id)?.name || id;
        if(!painEx.includes(nm)) painEx.push(nm);
      }
    });
  });
  const topAlt = Object.entries(altCount).sort((a,b) => b[1]-a[1]).slice(0,3).map(([id,c]) => {
    const nm = Object.values(EX).flat().find(e => e.id === id)?.name || id;
    return `<li>${nm}（${c}回）</li>`;
  }).join('');
  const selHtml = S.logDay
    ? renderSessionDetail(S.logDay)
    : '<p style="font-size:13px;color:var(--t2);padding:8px 0">カレンダーの日付をタップして詳細を確認</p>';

  document.getElementById('sec-log').innerHTML = `
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div>
          <div style="font-size:11px;color:var(--t3);margin-bottom:2px;font-weight:600;text-transform:uppercase;letter-spacing:.6px">β期間</div>
          <div style="font-size:15px;font-weight:700">${fmtDateDisplay(betaStart)} 〜 ${fmtDateDisplay(endDate)}</div>
        </div>
        <button class="sel-btn" style="font-size:12px;padding:7px 12px;flex-shrink:0"
          onclick="changeBetaStart()">開始日を変更</button>
      </div>
    </div>
    <div class="section-title">14日カレンダー</div>
    <div class="cal-grid">${calHtml}</div>
    ${selHtml}
    <div class="section-title">2週間サマリー（β期間対象）</div>
    <div class="summary-grid">
      <div class="sum-stat"><div class="sum-num">${total}</div><div class="sum-lbl">実施回数</div></div>
      <div class="sum-stat"><div class="sum-num">${Math.round(total/14*100)}%</div><div class="sum-lbl">実施率（14日）</div></div>
      <div class="sum-stat"><div class="sum-num">${avgRate}%</div><div class="sum-lbl">平均完了率</div></div>
    </div>
    <div class="card">
      <div class="card-title">代替が多かった種目</div>
      ${topAlt ? `<ul class="sum-list">${topAlt}</ul>` : '<p style="font-size:13px;color:var(--t2)">記録なし</p>'}
    </div>
    <div class="card">
      <div class="card-title">痛みが記録された種目</div>
      ${painEx.length ? `<ul class="sum-list">${painEx.map(n=>`<li>${n}</li>`).join('')}</ul>` : '<p style="font-size:13px;color:var(--t2)">記録なし</p>'}
    </div>
    <div class="card">
      <div class="card-title">データ管理</div>
      <div class="data-btns">
        <button class="data-btn" onclick="exportJSON()">📤 JSONエクスポート</button>
        <button class="data-btn" onclick="document.getElementById('importFile').click()">📥 JSONインポート</button>
        <button class="data-btn danger" onclick="confirmClear()">🗑 全データ削除</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)" />
    </div>`;
}

function selectLogDay(d) {
  S.logDay = (S.logDay===d) ? null : d;
  renderLog();
}

function renderSessionDetail(ds) {
  const sess = lsGet(KEYS.log(ds));
  if(!sess) return `<div class="session-detail"><p style="font-size:13px;color:var(--t2)">${fmtDate(ds)} — 記録なし</p></div>`;
  const day = DAYS[sess.day] || {};
  const exRows = Object.entries(sess.exercises||{}).map(([id,ex]) => {
    const exDef = Object.values(EX).flat().find(e=>e.id===id);
    const nm = exDef?.name || id;
    const doneSets = ex.sets?.filter(s=>s.done)||[];
    const setsStr = doneSets.map(s=>`${s.reps}回`).join('・');
    const flags = [];
    if(ex.pain && ex.pain!=='none') flags.push(`<span class="ex-log-flag flag-pain">${PAIN_LABELS[ex.pain]}</span>`);
    if(ex.altUsed) flags.push(`<span class="ex-log-flag flag-alt">代替:${ex.altName||'?'}</span>`);
    return `<div class="ex-log-item">
      <div class="ex-log-name">${nm}${flags.join('')}</div>
      <div class="ex-log-sets">${ex.todayW?ex.todayW+'kg ':''} ${setsStr||'記録なし'}</div>
    </div>`;
  }).join('');
  return `<div class="session-detail">
    <div class="card-title">${fmtDate(ds)} ${day.label||sess.day}</div>
    <div class="sd-row"><span class="sd-lbl">Phase</span><span class="sd-val">Phase ${(sess.phase||'').slice(1)}</span></div>
    <div class="sd-row"><span class="sd-lbl">完了率</span><span class="sd-val">${sess.completionRate||0}%</span></div>
    <div class="sd-row"><span class="sd-lbl">開始</span><span class="sd-val">${sess.startTime||'—'}</span></div>
    <div class="sd-row"><span class="sd-lbl">終了</span><span class="sd-val">${sess.endTime||'—'}</span></div>
    <div class="sd-row"><span class="sd-lbl">コンディション</span><span class="sd-val">疲労${sess.cond?.f||'?'}/睡眠${sess.cond?.s||'?'}/筋肉痛${sess.cond?.so||'?'}</span></div>
    ${sess.note ? `<div class="sd-row"><span class="sd-lbl">メモ</span><span class="sd-val" style="text-align:left">${sess.note}</span></div>` : ''}
    <hr class="sep">
    ${exRows}
  </div>`;
}

// ── Export / Import ──
function exportJSON() {
  const all = {};
  for(let i=0;i<localStorage.length;i++) {
    const k = localStorage.key(i);
    if(k && k.includes('daisuke')) { try{all[k]=JSON.parse(localStorage.getItem(k));}catch(e){} }
  }
  const blob = new Blob([JSON.stringify(all,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'daisuke_training_log.json';
  a.click();
}

function importJSON(input) {
  const file = input.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      Object.entries(data).forEach(([k,v]) => { try{localStorage.setItem(k,JSON.stringify(v));}catch(err){} });
      alert('インポートしました');
      renderLog();
    } catch(err) { alert('インポート失敗: ファイルの形式を確認してください'); }
  };
  r.readAsText(file);
}

function confirmClear() {
  if(!confirm('全データを削除します。この操作は取り消せません。')) return;
  for(let i=localStorage.length-1;i>=0;i--) {
    const k = localStorage.key(i);
    if(k && k.includes('daisuke')) localStorage.removeItem(k);
  }
  S.exData = {}; S.startTime = null; S.sessionNote = '';
  alert('削除しました');
  renderLog();
}
