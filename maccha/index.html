<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f4f0">
<title>まっちゃ専用 トレーニングメニューアプリ</title>
<style>
:root{
  --bg:#f5f4f0;--bg2:#eeede8;--bg3:#e4e3de;--card:#fff;
  --t1:#1c1c1a;--t2:#6b6a66;--t3:#9a9994;
  --b1:rgba(0,0,0,.12);--b2:rgba(0,0,0,.22);
  --green:#1a5c2a;--green-bg:#e8f4ec;--green-t:#1a5c2a;
  --amber:#7a4400;--amber-bg:#fff3e0;--amber-t:#7a4400;
  --red:#8b1a1a;--red-bg:#fdf0f0;--red-t:#8b1a1a;
  --blue:#1a4a7a;--blue-bg:#e8f0fa;--blue-t:#1a4a7a;
  --gray-bg:#f0efe9;--gray-t:#6b6a66;
  --r:10px;--r2:14px;
  --font:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:15px;line-height:1.5;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg)}
#hdr{background:var(--card);border-bottom:1px solid var(--b1);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#hdr-name{font-size:17px;font-weight:700}
#hdr-date{font-size:13px;color:var(--t2)}
#nav{display:flex;background:var(--card);border-bottom:1px solid var(--b1);flex-shrink:0}
.nav-btn{flex:1;padding:11px 4px;font-size:13px;font-family:var(--font);background:none;border:none;border-bottom:2.5px solid transparent;color:var(--t2);cursor:pointer;font-weight:500}
.nav-btn.active{color:var(--t1);border-bottom-color:var(--t1);font-weight:700}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sec{display:none;padding:12px 12px 120px}.sec.active{display:block}
.card{background:var(--card);border:1px solid var(--b1);border-radius:var(--r2);padding:14px;margin-bottom:10px}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px}
.sel-row{display:flex;gap:6px;flex-wrap:wrap}
.sel-btn{padding:8px 14px;border-radius:var(--r);border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:13px;font-family:var(--font);cursor:pointer;font-weight:500;min-height:40px}
.sel-btn.active{background:var(--t1);color:#fff;border-color:var(--t1)}
.cond-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cond-lbl{font-size:13px;color:var(--t2);width:52px;flex-shrink:0}
.cond-sl{flex:1;accent-color:var(--t1);height:24px}
.cond-val{font-size:14px;font-weight:700;width:16px;text-align:right}
.cond-val.bad{color:var(--red)}.cond-val.good{color:var(--green)}
.cond-hint{font-size:11px;color:var(--t3);flex-shrink:0;white-space:nowrap;line-height:24px}
.cond-warn{background:var(--amber-bg);border:1px solid #e8a000;border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--amber-t);margin-bottom:10px;display:none}
.cond-warn.show{display:block}
.progress-card{background:var(--card);border:1px solid var(--b1);border-radius:var(--r2);padding:12px 14px;margin-bottom:10px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress-lbl{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px}
.progress-num{font-size:18px;font-weight:900}.progress-sub{font-size:12px;color:var(--t3);margin-left:6px}
.progress-bar-bg{height:10px;background:var(--bg3);border-radius:5px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--green);border-radius:5px;transition:width .35s ease}
.progress-bar-fill.full{background:#1a5c2a}
.ex-card{background:var(--card);border:1.5px solid var(--b1);border-radius:var(--r2);margin-bottom:8px;overflow:hidden}
.ex-card.ex-done{border-color:#7ec89a}.ex-card.ex-skip{opacity:.55}
.ex-hdr{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px}
.ex-hdr:active{background:var(--bg2)}
.pri-badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;flex-shrink:0;white-space:nowrap}
.pri-must{background:var(--red-bg);color:var(--red)}
.pri-should{background:var(--amber-bg);color:var(--amber-t)}
.pri-can{background:var(--gray-bg);color:var(--gray-t)}
.ex-main{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:700;line-height:1.3}
.ex-tgt{font-size:12px;color:var(--t3);margin-top:1px}
.ex-stat{font-size:13px;color:var(--t2);flex-shrink:0;text-align:right;line-height:1.3}
.ex-body{padding:0 14px 14px;border-top:1px solid var(--b1)}
.safety-chip{display:block;background:var(--amber-bg);color:var(--amber-t);font-size:12px;padding:6px 10px;border-radius:var(--r);margin:6px 0 10px;line-height:1.5}
.w-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.w-lbl{font-size:13px;color:var(--t2);flex-shrink:0}
.w-inp{width:90px;height:44px;border:1.5px solid var(--b2);border-radius:var(--r);font-size:18px;font-weight:700;padding:0 10px;font-family:var(--font);background:var(--bg);color:var(--t1);text-align:center}
.w-inp:focus{outline:none;border-color:var(--t1)}
.w-unit{font-size:13px;color:var(--t2)}
.warmup-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wu-chip{background:var(--bg2);border-radius:var(--r);padding:6px 10px;font-size:12px;color:var(--t2)}
.wu-chip strong{color:var(--t1);font-size:14px}
.wu-chip .pct{font-size:10px;color:var(--t3);display:block;margin-bottom:1px}
.phase-main{background:var(--blue-bg);border-radius:var(--r);padding:6px 12px;font-size:13px;color:var(--blue-t);margin-bottom:10px;display:inline-block}
.sets-area{margin:8px 0}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:10px;background:var(--bg2);border-radius:var(--r)}
.set-row.set-done{background:#e8f4ec}
.set-num{font-size:13px;font-weight:700;color:var(--t2);width:34px;flex-shrink:0}
.rep-inp{width:70px;height:44px;border:1.5px solid var(--b2);border-radius:var(--r);font-size:20px;font-weight:700;text-align:center;font-family:var(--font);background:var(--card);color:var(--t1)}
.rep-inp:focus{outline:none;border-color:var(--t1)}
.rep-unit{font-size:13px;color:var(--t2);flex-shrink:0}
.set-done-btn{margin-left:auto;height:44px;padding:0 16px;border-radius:var(--r);border:none;background:var(--t1);color:#fff;font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;flex-shrink:0}
.set-done-btn:active{opacity:.8}
.edit-back-btn{margin-left:auto;height:40px;padding:0 12px;border-radius:var(--r);border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:12px;font-family:var(--font);cursor:pointer;flex-shrink:0}
.edit-back-btn:active{background:var(--bg3)}
.add-set-btn{background:none;border:1.5px dashed var(--b2);border-radius:var(--r);padding:8px 16px;color:var(--t2);font-size:13px;font-family:var(--font);cursor:pointer;width:100%;margin-top:4px}
.alt-toggle{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--b1);margin-top:10px;cursor:pointer}
.alt-toggle label{font-size:13px;color:var(--t2);cursor:pointer;flex:1}
.alt-toggle input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--t1)}
.alt-details{padding:10px 0;border-bottom:1px solid var(--b1);display:none}
.alt-details.show{display:block}
.alt-reason-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.alt-reason-btn{padding:7px 12px;border-radius:20px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:12px;font-family:var(--font);cursor:pointer;font-weight:500}
.alt-reason-btn.active{background:var(--t1);color:#fff;border-color:var(--t1)}
.alt-names{background:var(--bg2);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-top:4px}
.alt-name-item{padding:4px 0;color:var(--t1);cursor:pointer;border-bottom:1px solid var(--b1)}
.alt-name-item:last-child{border:none}
.alt-name-item.selected{color:var(--green);font-weight:700}
.pain-row{display:flex;gap:6px;margin:10px 0;align-items:center}
.pain-lbl{font-size:13px;color:var(--t2);flex-shrink:0}
.pain-btn{flex:1;height:40px;border-radius:var(--r);border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:12px;font-family:var(--font);cursor:pointer;font-weight:600}
.pain-btn.active-none{background:#e8f4ec;border-color:#7ec89a;color:var(--green)}
.pain-btn.active-slight{background:var(--amber-bg);border-color:#e8a000;color:var(--amber-t)}
.pain-btn.active-stop{background:var(--red-bg);border-color:#d04040;color:var(--red)}
.pain-warn{background:var(--red-bg);color:var(--red);font-size:12px;padding:8px 12px;border-radius:var(--r);margin-bottom:8px;display:none;line-height:1.5}
.pain-warn.show{display:block}
.note-lbl{font-size:12px;color:var(--t2);margin-top:10px;display:block}
.note-inp{width:100%;border:1.5px solid var(--b1);border-radius:var(--r);padding:10px 12px;font-size:15px;font-family:var(--font);background:var(--bg);color:var(--t1);resize:none;min-height:60px;margin-top:6px}
.note-inp:focus{outline:none;border-color:var(--t1)}
.suggest{padding:8px 12px;border-radius:var(--r);font-size:13px;margin-top:10px;display:block;font-weight:600}
.suggest-up{background:#e8f4ec;color:var(--green)}.suggest-stable{background:var(--blue-bg);color:var(--blue-t)}
.suggest-pain{background:var(--red-bg);color:var(--red)}.suggest-none{background:var(--bg2);color:var(--t2)}
.skip-row{display:flex;justify-content:flex-end;margin-top:8px}
.skip-btn{padding:7px 14px;border-radius:var(--r);border:1.5px solid var(--b2);background:none;color:var(--t3);font-size:12px;font-family:var(--font);cursor:pointer}
.session-ctrl{background:var(--card);border:1px solid var(--b1);border-radius:var(--r2);padding:14px;margin-bottom:10px;margin-top:4px}
.session-note-inp{width:100%;border:1.5px solid var(--b1);border-radius:var(--r);padding:10px 12px;font-size:15px;font-family:var(--font);background:var(--bg);color:var(--t1);resize:none;min-height:64px}
.session-note-inp:focus{outline:none;border-color:var(--t1)}
.save-btn{width:100%;height:52px;background:var(--t1);color:#fff;font-size:16px;font-weight:700;font-family:var(--font);border:none;border-radius:var(--r2);cursor:pointer;margin-top:10px}
.save-btn:active{opacity:.85}
#timer-bar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card);border-top:2px solid var(--b2);padding:12px 16px;z-index:200;display:none;box-shadow:0 -4px 20px rgba(0,0,0,.1)}
#timer-bar.show{display:block}
#timer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#timer-label{font-size:12px;color:var(--t2);flex:1}
#timer-num{font-size:36px;font-weight:900;letter-spacing:1px;color:var(--t1);text-align:center;flex:1}
#timer-num.almost{color:var(--amber-t)}#timer-num.done-state{color:var(--green)}
#timer-btns{display:flex;gap:8px;margin-top:8px}
.timer-btn{flex:1;height:44px;border-radius:var(--r);border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer}
.timer-btn:active{background:var(--bg3)}
#timer-hint{font-size:12px;color:var(--amber-t);background:var(--amber-bg);border-radius:var(--r);padding:6px 10px;margin-top:8px;display:none}
#timer-hint.show{display:block}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.cal-day{background:var(--card);border-radius:var(--r);padding:6px 4px;text-align:center;cursor:pointer;border:1.5px solid var(--b1);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal-day.has-session{border-color:#7ec89a;background:#f0faf3}
.cal-day.today{border-color:var(--t1);border-width:2px}
.cal-day.selected{background:var(--t1);color:#fff;border-color:var(--t1)}
.cal-day.selected .cal-dow,.cal-day.selected .cal-d{color:#fff}
.cal-day.future{opacity:.4;cursor:default;pointer-events:none}
.cal-dow{font-size:10px;color:var(--t3)}.cal-d{font-size:15px;font-weight:700}
.cal-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.session-detail{background:var(--card);border-radius:var(--r2);border:1px solid var(--b1);padding:14px;margin-bottom:10px}
.sd-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--b1);font-size:13px}
.sd-row:last-child{border:none;padding-bottom:0}
.sd-lbl{color:var(--t2);flex-shrink:0;width:100px}
.sd-val{color:var(--t1);font-weight:600;text-align:right;flex:1}
.ex-log-item{padding:8px 0;border-bottom:1px solid var(--b1);font-size:13px}
.ex-log-item:last-child{border:none}
.ex-log-name{font-weight:700;margin-bottom:2px}.ex-log-sets{color:var(--t2);font-size:12px}
.ex-log-flag{font-size:11px;padding:2px 8px;border-radius:10px;display:inline-block;margin-left:6px}
.flag-pain{background:var(--red-bg);color:var(--red)}.flag-alt{background:var(--amber-bg);color:var(--amber-t)}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum-stat{background:var(--card);border-radius:var(--r);padding:12px;border:1px solid var(--b1);text-align:center}
.sum-num{font-size:26px;font-weight:900;color:var(--t1)}.sum-lbl{font-size:12px;color:var(--t2);margin-top:2px}
.sum-list{font-size:13px;color:var(--t1)}
.sum-list li{padding:5px 0;border-bottom:1px solid var(--b1);list-style:none}
.sum-list li:last-child{border:none}
.ref-section{margin-bottom:12px}
.ref-toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);border-radius:var(--r2);border:1px solid var(--b1);cursor:pointer;font-size:14px;font-weight:700}
.ref-body{background:var(--card);border:1px solid var(--b1);border-top:none;border-radius:0 0 var(--r2) var(--r2);padding:14px;display:none;font-size:13px;color:var(--t2);line-height:1.8}
.ref-body.open{display:block}.ref-body strong{color:var(--t1)}
.ref-table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.ref-table th{text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--b2);font-weight:700;color:var(--t1)}
.ref-table td{padding:6px 8px;border-bottom:1px solid var(--b1)}
.ref-table tr:last-child td{border:none}
.data-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.data-btn{flex:1;min-width:120px;height:44px;border-radius:var(--r);border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer}
.data-btn.danger{background:var(--red-bg);color:var(--red);border-color:#d04040}
.data-btn:active{opacity:.8}
.section-title{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;margin-top:16px}
.section-title:first-child{margin-top:0}
hr.sep{border:none;border-top:1px solid var(--b1);margin:12px 0}
</style>
</head>
<body>
<div id="app">
  <div id="hdr"><div id="hdr-name">まっちゃ専用メニュー</div><div id="hdr-date"></div></div>
  <div id="nav">
    <button class="nav-btn active" onclick="showTab('today')">今日の実行</button>
    <button class="nav-btn" onclick="showTab('log')">2週間記録</button>
    <button class="nav-btn" onclick="showTab('ref')">設計書</button>
  </div>
  <div id="content">
    <div id="sec-today" class="sec active"></div>
    <div id="sec-log" class="sec"></div>
    <div id="sec-ref" class="sec"></div>
  </div>
  <div id="timer-bar">
    <div id="timer-top"><div id="timer-label">休憩タイマー</div><div id="timer-num">0:00</div></div>
    <div id="timer-btns">
      <button class="timer-btn" id="btn-pause" onclick="pauseTimer()">⏸ 停止</button>
      <button class="timer-btn" onclick="addTime(30)">+30秒</button>
      <button class="timer-btn" onclick="skipTimer()">スキップ →</button>
    </div>
    <div id="timer-hint"></div>
  </div>
</div>
<script>
const USER={name:'まっちゃ',id:'macha'};
const KEYS={log:d=>`trainingLog_macha_${d}`,hist:'exerciseHistory_macha',summary:'betaSummary_macha',betaStart:'betaStartDate_macha'};
const TIMER_KEY='timerState_macha';
const PRI={must:'必須',should:'できれば',can:'余裕があれば'};
const PRI_CLASS={must:'pri-must',should:'pri-should',can:'pri-can'};
const PAIN_LABELS={none:'なし',slight:'少しあり',stop:'中止レベル'};
const ALT_REASONS=[{key:'busy',label:'器具が空いていない'},{key:'pain',label:'痛み/違和感'},{key:'unsure',label:'やり方が不安'},{key:'pref',label:'好み'}];
const DAYS={
  da:{label:'Day A — 胸・肩・脚前側',sub:'大胸筋・三角筋・大腿四頭筋'},
  db:{label:'Day B — 背中・腕・体幹', sub:'広背筋・上腕・腹部'},
  dc:{label:'Day C — 臀部/脚・胸2nd・背中2nd',sub:'臀部・ハム・胸2nd・背中2nd'}
};
const EX={
da:[
{id:'da_e1',name:'チェストプレス（マシン）',target:'大胸筋中部（胸板の基盤づくり）',priority:'must',
 plan:{p1:{sets:3,reps:'12〜15',rmin:12,rest:90,rpe:'RPE 6〜7'},p2:{sets:3,reps:'10〜12',rmin:10,rest:90,rpe:'RPE 7〜8'},p3:{sets:4,reps:'8〜10',rmin:8,rest:90,rpe:'RPE 8前後'}},
 alts:{busy:'ダンベルフラットプレス（軽め）',pain:'ケーブルフライ（軽め）',pref:'ダンベルフラットプレス'},
 safety:'初心者でも安全に胸を鍛えられるマシン。フォームを確認しながら丁寧に動作'},
{id:'da_e2',name:'インクラインダンベルプレス（30°）',target:'大胸筋上部（鎖骨下の厚み）',priority:'must',
 plan:{p1:{sets:3,reps:'12〜15',rmin:12,rest:90,rpe:'RPE 6〜7'},p2:{sets:3,reps:'10〜12',rmin:10,rest:90,rpe:'RPE 7〜8'},p3:{sets:3,reps:'8〜10',rmin:8,rest:90,rpe:'RPE 8前後'}},
 alts:{busy:'チェストプレス（追加セット）',pain:'ケーブルフライ（ハイプーリー・軽め）',pref:'スミスマシンインクライン'},
 safety:'角度は30°で。深く降ろしすぎない。最初は軽めのダンベルでフォームを固める'},
{id:'da_e3',name:'レッグプレス',target:'大腿四頭筋・臀部（下半身の基盤）',priority:'must',
 plan:{p1:{sets:3,reps:'12〜15',rmin:12,rest:90,rpe:'RPE 6〜7'},p2:{sets:4,reps:'10〜12',rmin:10,rest:90,rpe:'RPE 7〜8'},p3:{sets:4,reps:'8〜10',rmin:8,rest:90,rpe:'RPE 8前後'}},
 alts:{busy:'スクワット（軽め）',pain:'レッグプレス（軽重量）',pref:'スクワット（軽め）'}},
{id:'da_e4',name:'ダンベルサイドレイズ',target:'三角筋側部（肩幅・存在感）',priority:'should',
 plan:{p1:{sets:3,reps:'15',rmin:15,rest:60,rpe:'RPE 6〜7'},p2:{sets:3,reps:'12〜15',rmin:12,rest:60,rpe:'RPE 7〜8'},p3:{sets:3,reps:'12',rmin:12,rest:60,rpe:'RPE 7〜8'}},
 alts:{busy:'ケーブルサイドレイズ',pain:'ケーブルサイドレイズ（超軽め）',pref:'ケーブルサイドレイズ'},

function startTimer(secs,exerciseId,setIndex,exName,setNum){
  clearInterval(timer.intervalId);
  timer={active:true,paused:false,endTime:Date.now()+secs*1000,remaining:secs,intervalId:null,exName,setNum,exerciseId,setIndex};
  saveTimerState();updateTimerUI();document.getElementById('timer-bar').classList.add('show');
  timer.intervalId=setInterval(tick,500);
}
function tick(){
  if(!timer.active||timer.paused)return;
  const rem=Math.max(0,Math.round((timer.endTime-Date.now())/1000));
  timer.remaining=rem;if(rem<=0){timerDone();}else{updateTimerUI();}
}
function updateTimerUI(){
  const num=document.getElementById('timer-num'),lbl=document.getElementById('timer-label'),hint=document.getElementById('timer-hint');
  if(!num)return;
  const h=condHint();hint.className=h?'timer-hint show':'timer-hint';hint.textContent=h;
  num.textContent=fmtSecs(timer.remaining);num.className=timer.remaining<=10?'almost':'';
  lbl.textContent=`${timer.exName} — Set${timer.setNum} 完了 | 休憩`;
  document.getElementById('btn-pause').textContent=timer.paused?'▶ 再開':'⏸ 停止';
}
function timerDone(){
  clearInterval(timer.intervalId);const num=document.getElementById('timer-num');
  if(num){num.textContent='▶ 次のセットへ';num.className='done-state';}
  if('vibrate' in navigator)navigator.vibrate([200,100,200]);
  timer.active=false;lsDel(TIMER_KEY);
}
function pauseTimer(){
  if(!timer.active)return;
  if(timer.paused){timer.endTime=Date.now()+timer.remaining*1000;timer.paused=false;}
  else{timer.remaining=Math.max(0,Math.round((timer.endTime-Date.now())/1000));timer.paused=true;}
  saveTimerState();updateTimerUI();
}
function addTime(s){
  if(!timer.active){startTimer(s,timer.exerciseId||'',timer.setIndex??-1,timer.exName||'',timer.setNum||0);return;}
  if(timer.paused){timer.remaining+=s;}else{timer.endTime+=s*1000;timer.remaining=Math.max(0,Math.round((timer.endTime-Date.now())/1000));}
  saveTimerState();updateTimerUI();
}
function skipTimer(){
  clearInterval(timer.intervalId);timer.active=false;timer.remaining=0;timer.endTime=null;
  lsDel(TIMER_KEY);document.getElementById('timer-bar').classList.remove('show');
}
function saveTimerState(){
  if(timer.active){lsSet(TIMER_KEY,{active:true,paused:timer.paused,endTime:timer.endTime,remaining:timer.remaining,exName:timer.exName,setNum:timer.setNum,exerciseId:timer.exerciseId,setIndex:timer.setIndex});}
  else{lsDel(TIMER_KEY);}
}
function loadTimerState(){
  const saved=lsGet(TIMER_KEY);if(!saved||!saved.active)return;
  const now=Date.now();
  if(!saved.paused){
    const rem=Math.max(0,Math.round((saved.endTime-now)/1000));
    if(rem<=0){lsDel(TIMER_KEY);document.getElementById('timer-bar').classList.add('show');const n=document.getElementById('timer-num');if(n){n.textContent='▶ 次のセットへ';n.className='done-state';}const l=document.getElementById('timer-label');if(l)l.textContent=`${saved.exName||''} — Set${saved.setNum||''} 完了 | 休憩終了`;return;}
    timer.active=true;timer.paused=false;timer.endTime=saved.endTime;timer.remaining=rem;timer.exName=saved.exName;timer.setNum=saved.setNum;timer.exerciseId=saved.exerciseId||'';timer.setIndex=saved.setIndex??-1;
    document.getElementById('timer-bar').classList.add('show');updateTimerUI();timer.intervalId=setInterval(tick,500);
  }else{
    timer.active=true;timer.paused=true;timer.remaining=saved.remaining;timer.endTime=now+saved.remaining*1000;timer.exName=saved.exName;timer.setNum=saved.setNum;timer.exerciseId=saved.exerciseId||'';timer.setIndex=saved.setIndex??-1;
    document.getElementById('timer-bar').classList.add('show');updateTimerUI();timer.intervalId=setInterval(tick,500);
  }
}

      初心者の場合、少ないボリュームでも神経適応と筋肥大は起きやすい。まずは継続を最優先にする。`},
    {title:'④ Phase方針',body:`
      <strong>Phase 1（4〜6週）50〜65% / RPE 6〜7</strong>：<br>
      10〜15rep中心。マシン・ダンベル軽め。フォームと可動域の確認が最優先。「もっとできる」感覚で終わることが大事。<br><br>
      <strong>Phase 2（6〜8週）60〜75% / RPE 7〜8</strong>：<br>
      8〜12rep中心。ダンベルやケーブル種目を増やす。2週ごとに+2.5kgを目安に重量を増やす（アプリが自動判定）。<br><br>
      <strong>Phase 3（6〜8週）70〜82.5% / RPE 8前後</strong>：<br>
      6〜12rep中心。ダンベルフラットプレスで習得したフォームを活かして、バーベルベンチプレスに挑戦するかどうかを判断するタイミング。`},
    {title:'⑤ 重量設定ガイド',body:`
      <strong>初回の重量選び</strong>：「10〜12回できてまだ余裕がある（RPE 6程度）」重量からスタート。<br><br>
      <strong>ウォームアップ目安</strong>（各種目メイン前）：<br>
      W1: 40% × 15rep → 60秒<br>W2: 55% × 8rep → 90秒<br>W3: 70% × 4〜5rep → 2分<br>→ メインセットへ（アプリが自動計算）<br><br>
      <strong>重量アップのルール</strong>：同重量で2〜3回連続して目標rep上限をクリアし、痛みがなければ次回+2.5kg（アプリが自動表示）。初心者期は毎回のようにアップできることもある。それが正常。`},
    {title:'⑥ ベンチプレス不安への設計上の配慮',body:`
      ベンチプレスは「バーベルが顔に落ちるかも」「フォームが崩れて肩を壊すかも」という不安が多い種目。段階的なアプローチで安全に習得する。<br><br>
      <strong>Phase 1</strong>：チェストプレス（マシン）で胸の使い方を覚える。Day C でダンベルフラットプレス（軽め）で「プレス動作」に慣れる。<br><br>
      <strong>Phase 2</strong>：ダンベルフラットプレスの重量を少しずつ上げる。肩への違和感がなければ継続。<br><br>
      <strong>Phase 3移行時に判断</strong>：バーベルベンチプレスへの移行は「したければする」程度でOK。ダンベル・マシン・ケーブルの組み合わせでも十分な胸の発達は期待できる。`}
  ];
  document.getElementById('sec-ref').innerHTML=secs.map((s,i)=>`<div class="ref-section"><div class="ref-toggle" onclick="toggleRef(${i})">${s.title} <span id="ref-chev-${i}">▼</span></div><div class="ref-body" id="ref-body-${i}">${s.body}</div></div>`).join('');
}
function toggleRef(i){const b=document.getElementById(`ref-body-${i}`),c=document.getElementById(`ref-chev-${i}`);c.textContent=b.classList.toggle('open')?'▲':'▼';}
function init(){
  const d=new Date();document.getElementById('hdr-date').textContent=`${d.getMonth()+1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）`;
  loadTodaySession();EX[S.day].forEach(ex=>ensureExData(ex));renderToday();loadTimerState();
}
init();
</script>
